name: sudoku-sally

# Production stack for server 2 (gowithsally-prod, 88.198.205.229).
# Caddy (container `gws-caddy`) on the external network `gowithsally_gws-net`
# fronts everything with automatic HTTPS. Public-facing containers (landing +
# the API/UI proxies) join that edge network; data stores stay private.
# No host ports are published — Caddy reaches containers by name.

services:
  api:
    build: ../backend
    image: sudoku-sally-api:latest
    container_name: sudoku-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      MONGODB_URI: mongodb://sudoku-mongo:27017/sudoku_sally
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in deploy/.env.prod}
      JWT_EXPIRE: 30d
      REDIS_URL: redis://:${REDIS_PASSWORD}@sudoku-redis:6379   # ready for future caching
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_HOST: ${TURN_HOST:-turn.salistar.com}
      # YouTube Live OAuth (control-plane) + media relay. Values live in
      # deploy/.env.prod (preserved across redeploys by deploy.sh).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://api.sallysudo.com/api/youtube/callback}
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY:-}
    depends_on:
      - mongo
    networks:
      - sudoku
      - edge          # so Caddy can serve api.sallysudo.com
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    container_name: sudoku-mongo
    restart: unless-stopped
    volumes:
      - sudoku_mongo_data:/data/db
    networks:
      - sudoku
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sudoku-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "--appendonly", "yes"]
    volumes:
      - sudoku_redis_data:/data
    networks:
      - sudoku
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  landing:
    build: ../landing
    image: sudoku-sally-landing:latest
    container_name: sudoku-landing
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - sudoku_downloads:/usr/share/nginx/html/downloads   # self-hosted APK
    networks:
      - sudoku
      - edge

  # ── Web build of the app (react-native-web via Expo) — app.sallysudo.com
  # Multi-stage Dockerfile.web does `expo export --platform web` inside a
  # node:18-alpine builder, then copies the static `dist/` into a tiny nginx.
  # `--build` on `docker compose up` will rebuild this whenever mobile/ changes.
  web:
    build:
      context: ../mobile
      dockerfile: Dockerfile.web
    image: sudoku-sally-web:latest
    container_name: sudoku-web
    restart: unless-stopped
    networks:
      - sudoku
      - edge          # so Caddy can serve app.sallysudo.com
    expose:
      - "80"

  # ── Admin UIs (own basic-auth, served over HTTPS via Caddy) ──────────────
  mongo-ui:
    image: mongo-express:1.0.2
    container_name: sudoku-mongo-ui
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://sudoku-mongo:27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${UI_USER:?UI_USER must be set}
      ME_CONFIG_BASICAUTH_PASSWORD: ${UI_PASS:?UI_PASS must be set}
    depends_on:
      - mongo
    networks:
      - sudoku
      - edge
    expose:
      - "8081"

  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: sudoku-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:sudoku-redis:6379:0:${REDIS_PASSWORD}"
      HTTP_USER: ${UI_USER:?UI_USER must be set}
      HTTP_PASSWORD: ${UI_PASS:?UI_PASS must be set}
    depends_on:
      - redis
    networks:
      - sudoku
      - edge
    expose:
      - "8081"

volumes:
  sudoku_mongo_data:
  sudoku_redis_data:
  sudoku_downloads:

networks:
  sudoku:
    name: sudoku_net
  edge:
    # srv3 fronts every vhost with the `caddy` container on a shared external
    # network literally named `edge` (the srv2-era `gowithsally_gws-net` was
    # cleaned up during the sallysudo.com migration — this repo is srv3-only).
    name: edge
    external: true
