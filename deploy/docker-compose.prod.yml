name: sudoku-sally

# Production stack for server 2 (gowithsally-prod, 88.198.205.229).
# The box already runs a Caddy reverse proxy (container `gws-caddy`) on the
# external Docker network `gowithsally_gws-net`, with automatic HTTPS.
# We attach ONLY the landing container to that edge network so Caddy can
# reverse_proxy sudoku.gowithsally.com → sudoku-landing:80.
# api + mongo stay on a private internal network. No host ports are published.

services:
  api:
    build: ../backend
    image: sudoku-sally-api:latest
    container_name: sudoku-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      MONGODB_URI: mongodb://mongo:27017/sudoku_sally
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in deploy/.env.prod}
      JWT_EXPIRE: 30d
    depends_on:
      - mongo
    networks:
      - sudoku
    expose:
      - "3001"

  mongo:
    image: mongo:7.0
    container_name: sudoku-mongo
    restart: unless-stopped
    volumes:
      - sudoku_mongo_data:/data/db
    networks:
      - sudoku

  landing:
    build: ../landing
    image: sudoku-sally-landing:latest
    container_name: sudoku-landing
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - sudoku          # to reach sudoku-api (proxy /api & /socket.io)
      - edge            # so gws-caddy can reach it
    # No host ports: Caddy (on the edge network) fronts it on 443.

volumes:
  sudoku_mongo_data:

networks:
  sudoku:
    name: sudoku_net
  edge:
    name: gowithsally_gws-net
    external: true
