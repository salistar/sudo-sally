# ────────────────────────────────────────────────────────────────────────
# Cloudflare Tunnel ingress for sudoku.gowithsally.com  (server 1)
# ────────────────────────────────────────────────────────────────────────
# Server 1 exposes NO public ports — traffic arrives via the existing
# Cloudflare Tunnel (cloudflared). Add the rule below to that tunnel's config.
#
# 1) Add the hostname rule ABOVE the final catch-all (http_status:404):
#
# ingress:
#   - hostname: sudoku.gowithsally.com
#     service: http://localhost:8091          # cloudflared as a HOST service
#     # service: http://sudoku-landing:80      # cloudflared as a CONTAINER on sudoku_net
#   # ... your existing SallyCards / other rules ...
#   - service: http_status:404
#
# 2) Create the DNS route (one-time):
#       cloudflared tunnel route dns <TUNNEL_NAME> sudoku.gowithsally.com
#    (or add a CNAME  sudoku → <TUNNEL_ID>.cfargotunnel.com  in the Cloudflare dashboard)
#
# 3) Reload cloudflared:
#       systemctl restart cloudflared        # host service
#       # or:  docker restart cloudflared    # containerized
#
# 4) If cloudflared runs as a container, make sure it shares a network with the
#    landing container:
#       docker network connect sudoku_net cloudflared
# ────────────────────────────────────────────────────────────────────────
