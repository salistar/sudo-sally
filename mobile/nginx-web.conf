server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed Expo / asset bundles — cache forever
  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Expo-router static routes: /welcome → welcome.html, fallback to index.html (SPA)
  location / {
    try_files $uri $uri.html $uri/index.html /index.html;
  }

  # Health check
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
