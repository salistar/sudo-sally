name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/build-apk.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        # --legacy-peer-deps because react-native-webrtc + expo-av occasionally
        # publish peer ranges newer than what SDK 52 ships.
        run: npm ci --legacy-peer-deps

      - name: Prebuild Android project
        # Generates android/ from the Expo config. The prebuilt project already
        # contains a `release` buildType signed with debug.keystore, so we don't
        # need to patch build.gradle ourselves.
        run: npx expo prebuild --platform android --no-install

      # Reuse the keystore whose SHA-1 is registered in Google Cloud Console
      # for the OAuth client. Both `debug` and `release` build types use this
      # file (prebuild wires both to signingConfigs.debug), so Google Sign-In
      # works in the same APK that we'd later upload to Play.
      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_B64 secret is empty — set it in repo settings."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/app/debug.keystore
          keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|Owner|Valid" || true

      # Drop x86 / x86_64 ABIs. Only emulators use them and react-native-webrtc
      # ships ~50 MB of native libs per ABI. This shrinks the APK from ~190 MB
      # down to ~80 MB without dropping a single physical Android device.
      - name: Trim unused ABIs
        run: |
          GRADLE_FILE=android/app/build.gradle
          if ! grep -q "abiFilters" "$GRADLE_FILE"; then
            sed -i '/defaultConfig *{/a\        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }' "$GRADLE_FILE"
          fi
          grep -B1 -A1 "abiFilters" "$GRADLE_FILE" | head -5

      # Build BOTH the SIGNED RELEASE APK and the SIGNED RELEASE AAB.
      #
      # • APK (assembleRelease)  → for sideload (sudoku.gowithsally.com/downloads,
      #   WhatsApp, etc.). Release variant: JS bundled, Hermes, no Metro, no red
      #   box. Same artifact you'd hand to a friend over WhatsApp.
      # • AAB (bundleRelease)    → for Google Play Console upload. Play splits
      #   it into per-device APKs (saves users ~30% download).
      #
      # Both come from the same release variant → identical code, identical
      # signing key, identical SHA-1. The same OAuth registration covers both.
      - name: Build release APK + AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Stage APK + AAB
        run: |
          mkdir -p ../artifacts
          cp android/app/build/outputs/apk/release/app-release.apk ../artifacts/sudoku-sally.apk
          cp android/app/build/outputs/bundle/release/app-release.aab ../artifacts/sudoku-sally.aab
          ls -lh ../artifacts/
          # Confirm the JS bundle (Hermes .bundle) is inside the APK
          unzip -l ../artifacts/sudoku-sally.apk | grep -E "assets/index.android.bundle|lib/arm64-v8a/" | head -5

      - name: Upload APK + AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-sally-apk
          path: |
            artifacts/sudoku-sally.apk
            artifacts/sudoku-sally.aab
          if-no-files-found: error

      - name: Attach APK + AAB to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/sudoku-sally.apk
            artifacts/sudoku-sally.aab
          fail_on_unmatched_files: true
