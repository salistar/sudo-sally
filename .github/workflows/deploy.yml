name: Deploy to server (gowithsally-prod)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "landing/**"
      - "deploy/**"
      - "mobile/**"                     # web build of the app lives in mobile/
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (build & restart the sudoku stack)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: JWT_SECRET,REDIS_PASSWORD,UI_USER,UI_PASS,TURN_SHARED_SECRET,CF_API_TOKEN,CF_ZONE_ID
          script: |
            set -euo pipefail
            REPO_DIR="$HOME/apps/sudo-sally"
            mkdir -p "$HOME/apps"
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone https://github.com/salistar/sudo-sally.git "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            git fetch --depth 1 origin main
            git reset --hard origin/main
            export JWT_SECRET REDIS_PASSWORD UI_USER UI_PASS TURN_SHARED_SECRET CF_API_TOKEN CF_ZONE_ID
            bash deploy/deploy.sh
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          UI_USER: ${{ secrets.UI_USER }}
          UI_PASS: ${{ secrets.UI_PASS }}
          TURN_SHARED_SECRET: ${{ secrets.TURN_SHARED_SECRET }}
          # Optional — when set, deploy.sh purges the CDN cache for the APK URL
          # so a new build is visible immediately instead of after Cloudflare's TTL.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
