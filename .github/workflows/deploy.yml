name: Deploy to server (legacy gowithsally-prod)

# SUPERSEDED: production now runs on srv3 (sallysudo.com) and is deployed
# manually (docker cp + commit + restart) gated by scripts/predeploy.sh.
# This legacy SSH deploy targeted the decommissioned gowithsally box, so the
# automatic push trigger was REMOVED (it failed on every push). Kept as
# manual-only (workflow_dispatch) in case the SSH deploy is revived — and it
# now requires the tests gate to pass first.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    name: Tests gate (must pass before deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Backend tests + coverage threshold
        working-directory: backend
        run: npm install --no-audit --no-fund && NODE_ENV=test npx jest --coverage --ci
      - name: Mobile unit tests
        working-directory: mobile
        run: npm install --no-audit --no-fund --legacy-peer-deps && npx jest --ci

  deploy:
    needs: test          # ← deploy blocked unless the tests gate is green
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (build & restart the sudoku stack)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: JWT_SECRET,REDIS_PASSWORD,UI_USER,UI_PASS,TURN_SHARED_SECRET,CF_API_TOKEN,CF_ZONE_ID
          script: |
            set -euo pipefail
            REPO_DIR="$HOME/apps/sudo-sally"
            mkdir -p "$HOME/apps"
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone https://github.com/salistar/sudo-sally.git "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            git fetch --depth 1 origin main
            git reset --hard origin/main
            export JWT_SECRET REDIS_PASSWORD UI_USER UI_PASS TURN_SHARED_SECRET CF_API_TOKEN CF_ZONE_ID
            bash deploy/deploy.sh
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          UI_USER: ${{ secrets.UI_USER }}
          UI_PASS: ${{ secrets.UI_PASS }}
          TURN_SHARED_SECRET: ${{ secrets.TURN_SHARED_SECRET }}
          # Optional — when set, deploy.sh purges the CDN cache for the APK URL
          # so a new build is visible immediately instead of after Cloudflare's TTL.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
