<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="SallySudo">
  <defs>
    <linearGradient id="ob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1a"/>
      <stop offset="0.5" stop-color="#12122a"/>
      <stop offset="1" stop-color="#1a1a3a"/>
    </linearGradient>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#2dd4db"/>
    </linearGradient>
    <radialGradient id="oglow" cx="0.78" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ob)"/>
  <rect width="1200" height="630" fill="url(#oglow)"/>
  <!-- big card -->
  <g transform="translate(760,120)">
    <rect x="0" y="0" width="320" height="320" rx="36" fill="#13132c" stroke="#2dd4db" stroke-opacity="0.4" stroke-width="2"/>
    <g transform="translate(36,36)">
      <rect x="0" y="0" width="72" height="72" rx="12" fill="#7c5cff" fill-opacity="0.12"/>
      <rect x="88" y="0" width="72" height="72" rx="12" fill="#ffffff" fill-opacity="0.05"/>
      <rect x="176" y="0" width="72" height="72" rx="12" fill="#7c5cff" fill-opacity="0.12"/>
      <rect x="0" y="88" width="72" height="72" rx="12" fill="#ffffff" fill-opacity="0.05"/>
      <rect x="88" y="88" width="72" height="72" rx="12" fill="#7c5cff" fill-opacity="0.12"/>
      <rect x="176" y="88" width="72" height="72" rx="12" fill="#ffffff" fill-opacity="0.05"/>
      <rect x="0" y="176" width="72" height="72" rx="12" fill="#7c5cff" fill-opacity="0.12"/>
      <rect x="88" y="176" width="72" height="72" rx="12" fill="#ffffff" fill-opacity="0.05"/>
      <rect x="176" y="176" width="72" height="72" rx="12" fill="#7c5cff" fill-opacity="0.12"/>
      <g fill="url(#og)" font-family="Verdana, sans-serif" font-weight="bold" font-size="54" text-anchor="middle">
        <text x="36" y="55">5</text>
        <text x="212" y="55">9</text>
        <text x="124" y="143">7</text>
        <text x="36" y="231">2</text>
        <text x="212" y="231">6</text>
      </g>
    </g>
  </g>
  <!-- text -->
  <g transform="translate(90,250)">
    <text x="0" y="0" fill="#7c5cff" font-family="Verdana, sans-serif" font-size="22" font-weight="bold" letter-spacing="6">TRAIN YOUR BRAIN DAILY</text>
    <text x="0" y="78" fill="#ffffff" font-family="Verdana, sans-serif" font-size="78" font-weight="bold" letter-spacing="6">SALLYSUDO</text>
    <text x="0" y="130" fill="#94a3b8" font-family="Verdana, sans-serif" font-size="28">The beautiful, modern Sudoku game for Android &amp; iOS</text>
  </g>
